version: 2

# One combined PR per month across all ecosystems instead of one PR per package.
# Security updates still open on their own as soon as an advisory lands.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "npm"
    directory: "/site"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
