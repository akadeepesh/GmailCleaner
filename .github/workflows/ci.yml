name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t gmailcleaner .
      - run: docker build -f deploy/Dockerfile.web -t gmailcleaner-web .
      - name: Smoke-test the images
        run: |
          docker run --rm gmailcleaner --version
          docker run --rm --entrypoint python gmailcleaner-web -c "from web.app import create_app; create_app()"
