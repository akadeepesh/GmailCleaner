# GmailCleaner — Cloud Build CI/CD Pipeline
#
# Triggered on push to main branch (configure in Cloud Build console).
# Builds the container, runs tests, pushes to Artifact Registry,
# and updates the Cloud Run Job.
#
# Required substitutions (set in Cloud Build trigger):
#   _GCP_PROJECT:   Your GCP project ID
#   _REGION:        Cloud Run region (e.g. us-central1)
#   _JOB_NAME:      Cloud Run Job name (e.g. gmail-cleaner)
#   _REPO:          Artifact Registry repo name (e.g. gmail-cleaner)

substitutions:
  _GCP_PROJECT: "your-gcp-project-id"
  _REGION: "us-central1"
  _JOB_NAME: "gmail-cleaner"
  _REPO: "gmail-cleaner"

steps:
  # ── Step 1: Run tests ─────────────────────────────────────────────────────
  - name: "python:3.11-slim"
    id: "test"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements.txt --quiet
        python -m pytest tests/ -v --tb=short
    waitFor: ["-"] # Start immediately

  # ── Step 2: Build container image ─────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT}/${_REPO}/gmailcleaner:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT}/${_REPO}/gmailcleaner:latest"
      - "-f"
      - "deploy/Dockerfile"
      - "."
    waitFor: ["test"]

  # ── Step 3: Push to Artifact Registry ─────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT}/${_REPO}/gmailcleaner"
    waitFor: ["build"]

  # ── Step 4: Update Cloud Run Job ──────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy"
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${_GCP_PROJECT}/${_REPO}/gmailcleaner:${SHORT_SHA}"
      - "--region=${_REGION}"
    waitFor: ["push"]

images:
  - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT}/${_REPO}/gmailcleaner:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT}/${_REPO}/gmailcleaner:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
