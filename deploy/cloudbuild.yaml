# GmailCleaner — Cloud Build CI/CD pipeline
#
# Trigger on push to main (configure in the Cloud Build console).
# Runs the tests, builds both images, pushes them to Artifact Registry and
# rolls the new images out to the Cloud Run Job and Service.
#
# Run the deploy scripts once first (deploy/deploy_job.sh and
# deploy/deploy_dashboard.sh); this pipeline only updates images.
#
# Substitutions (override in the trigger):
#   _REGION:   Cloud Run region
#   _REPO:     Artifact Registry repo name
#   _JOB:      Cloud Run Job name
#   _SERVICE:  Cloud Run Service name (set to "" to skip the dashboard)

substitutions:
  _REGION: "us-central1"
  _REPO: "gmail-cleaner"
  _JOB: "gmail-cleaner"
  _SERVICE: "gmail-cleaner-dashboard"

steps:
  # ── Tests ──────────────────────────────────────────────────────────────────
  - name: "python:3.12-slim"
    id: "test"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install -r requirements-dev.txt --quiet
        python -m pytest tests/ -q --tb=short
    waitFor: ["-"]

  # ── Build images ───────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-job"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner:latest"
      - "-f"
      - "deploy/Dockerfile"
      - "."
    waitFor: ["test"]

  - name: "gcr.io/cloud-builders/docker"
    id: "build-web"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner-web:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner-web:latest"
      - "-f"
      - "deploy/Dockerfile.web"
      - "."
    waitFor: ["test"]

  # ── Push ───────────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-job"
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner"]
    waitFor: ["build-job"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-web"
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner-web"]
    waitFor: ["build-web"]

  # ── Roll out ───────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-job"
    entrypoint: gcloud
    args:
      - "run"
      - "jobs"
      - "update"
      - "${_JOB}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner:${SHORT_SHA}"
      - "--region=${_REGION}"
    waitFor: ["push-job"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "deploy-web"
    entrypoint: bash
    args:
      - "-c"
      - |
        if [ -n "${_SERVICE}" ]; then
          gcloud run services update "${_SERVICE}" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner-web:${SHORT_SHA}" \
            --region="${_REGION}"
        fi
    waitFor: ["push-web"]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner:latest"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner-web:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/gmailcleaner-web:latest"

options:
  logging: CLOUD_LOGGING_ONLY
