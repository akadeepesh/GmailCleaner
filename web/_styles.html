<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --text: #e4e6f0;
      --muted: #8891b0;
      --accent: #5b7fff;
      --accent-dim: #3a4fa6;
      --red: #e05c5c;
      --green: #4caf7d;
      --yellow: #e0a84a;
      --purple: #9b6dff;
      --orange: #e07a3a;
      --radius: 10px;
      --sidebar-w: 220px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
    }

    .sidebar-logo {
      padding: 0 20px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .sidebar-logo h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .sidebar-logo span {
      font-size: 11px;
      color: var(--muted);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      border-left: 2px solid transparent;
      transition: all 0.15s;
    }

    .nav-item:hover { color: var(--text); background: var(--surface2); }
    .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--surface2); }
    .nav-icon { font-size: 15px; width: 18px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 20px 0;
      border-top: 1px solid var(--border);
    }

    .sidebar-footer p { font-size: 11px; color: var(--muted); }

    /* ── Main content ────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 32px;
      min-height: 100vh;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .page-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .page-header p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* ── Cards ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 14px;
    }

    /* ── Stat pills ──────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .stat-card .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-card .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 4px;
      line-height: 1;
    }

    .stat-card .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Tables ──────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* ── Badges ──────────────────────────────────────────── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-red    { background: rgba(224,92,92,.18);  color: var(--red);    }
    .badge-green  { background: rgba(76,175,125,.18); color: var(--green);  }
    .badge-yellow { background: rgba(224,168,74,.18); color: var(--yellow); }
    .badge-purple { background: rgba(155,109,255,.18);color: var(--purple); }
    .badge-blue   { background: rgba(91,127,255,.18); color: var(--accent); }
    .badge-muted  { background: var(--surface2);      color: var(--muted);  }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4a6ef0; }
    .btn-danger  { background: rgba(224,92,92,.15); color: var(--red); border: 1px solid rgba(224,92,92,.3); }
    .btn-danger:hover { background: rgba(224,92,92,.25); }
    .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    /* ── Alerts ──────────────────────────────────────────── */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .alert-info   { background: rgba(91,127,255,.12); border: 1px solid rgba(91,127,255,.3); color: #a0b4ff; }
    .alert-warn   { background: rgba(224,168,74,.12); border: 1px solid rgba(224,168,74,.3); color: var(--yellow); }
    .alert-danger { background: rgba(224,92,92,.12);  border: 1px solid rgba(224,92,92,.3);  color: var(--red); }
    .alert-ok     { background: rgba(76,175,125,.12); border: 1px solid rgba(76,175,125,.3); color: var(--green); }

    /* ── Chart placeholder ───────────────────────────────── */
    .chart-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .chart-bar-label { width: 70px; color: var(--muted); text-align: right; flex-shrink: 0; }
    .chart-bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .chart-bar-fill  { height: 100%; border-radius: 4px; transition: width 0.4s; }
    .chart-bar-val   { width: 40px; color: var(--muted); }

    /* ── Misc ────────────────────────────────────────────── */
    .muted { color: var(--muted); }
    .mono  { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; }
    code   { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: monospace; }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .flex { display: flex; align-items: center; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mt-1  { margin-top: 4px; }
    .mt-2  { margin-top: 8px; }
    .mt-3  { margin-top: 16px; }
    .mb-2  { margin-bottom: 8px; }
    .mb-3  { margin-bottom: 16px; }
    .small { font-size: 12px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-lg { padding: 12px 22px; font-size: 15px; font-weight: 600; border-radius: 9px; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    a { color: var(--accent); }

    /* ── Account switcher ────────────────────────────────── */
    .account-switch { padding: 0 20px 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .account-switch label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

    /* ── Forms ───────────────────────────────────────────── */
    input[type=text], input[type=number], input[type=email], input[type=password], select, textarea {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-dim); border-color: var(--accent); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    textarea { min-height: 90px; resize: vertical; font-family: 'SFMono-Regular', Consolas, monospace; }
    .field { margin-bottom: 16px; }
    .field > label { display: block; font-weight: 600; margin-bottom: 4px; }
    .field .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .field .error { color: var(--red); font-size: 12px; margin-top: 4px; display: none; }
    .field.has-error .error { display: block; }
    .field.has-error input, .field.has-error textarea { border-color: var(--red); }
    .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    details.advanced summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-bottom: 10px; }

    .toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; }
    .toggle input { display: none; }
    .toggle .track { width: 36px; height: 20px; background: var(--border); border-radius: 20px; position: relative; transition: background .15s; flex-shrink: 0; }
    .toggle .track::after { content: ""; position: absolute; width: 14px; height: 14px; top: 3px; left: 3px; background: #fff; border-radius: 50%; transition: left .15s; }
    .toggle input:checked + .track { background: var(--accent); }
    .toggle input:checked + .track::after { left: 19px; }

    /* ── Progress ────────────────────────────────────────── */
    .progress { height: 10px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
    .progress-wrap { display: none; margin-top: 14px; }
    .progress-wrap.visible { display: block; }

    /* ── Welcome steps ───────────────────────────────────── */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .step { background: var(--surface2); border-radius: 8px; padding: 14px; }
    .step .num { font-weight: 700; color: var(--accent); }
    .step.done .num { color: var(--green); }

    /* ── Toasts ──────────────────────────────────────────── */
    #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; max-width: 380px; }
    .toast { background: var(--surface2); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: 8px; padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.4); font-size: 13px; }
    .toast.ok { border-left-color: var(--green); }
    .toast.error { border-left-color: var(--red); }
    .toast.warn { border-left-color: var(--yellow); }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 40; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: min(480px, 92vw); }
    .modal h3 { font-size: 17px; margin-bottom: 10px; }
    .modal p { color: var(--muted); margin-bottom: 18px; white-space: pre-line; }
    .modal .modal-input { margin-bottom: 16px; display: none; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }

    .empty-state { text-align: center; padding: 30px 10px; }
    .empty-state p { color: var(--muted); margin-bottom: 14px; }
  </style>
